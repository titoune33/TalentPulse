[pytest]
testpaths = tests
addopts = -q --strict-markers
# Third-party deprecations only: python-jose and Starlette's TestClient still
# call datetime.utcnow(). Our own code uses timeutils.utcnow() and Pydantic v2
# config, so anything else surfacing here is worth looking at.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
