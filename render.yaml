# Render Blueprint — TalentPulse
# Déploiement "one-click" : https://render.com → New → Blueprint → sélectionner ce repo.
# Le blueprint crée : la base PostgreSQL, l'API FastAPI et le frontend statique.

databases:
  - name: talentpulse-db
    plan: free
    databaseName: talentpulse

services:
  # ===== API FastAPI =====
  - type: web
    name: talentpulse-backend
    runtime: docker
    repo: https://github.com/titoune33/TalentPulse
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://talentpulse-frontend.onrender.com
      - key: PORT
        value: "8000"

  # ===== Frontend statique (Next.js export) =====
  - type: web
    name: talentpulse-frontend
    runtime: static
    repo: https://github.com/titoune33/TalentPulse
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://talentpulse-backend.onrender.com
