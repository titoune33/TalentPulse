# Render Blueprint — TalentPulse
# Déploiement "one-click" : https://render.com → New → Blueprint → sélectionner ce repo.
# Le blueprint crée : la base PostgreSQL, l'API FastAPI et le frontend statique.

databases:
  - name: talentpulse-db
    plan: free
    databaseName: talentpulse

services:
  # ===== API FastAPI =====
  - type: web
    name: talentpulse-backend
    runtime: python
    repo: https://github.com/titoune33/TalentPulse
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://talentpulse-frontend.onrender.com
      - key: PORT
        value: "8000"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: FRONTEND_URL
        value: https://talentpulse-frontend.onrender.com

  # ===== Frontend statique (Next.js export) =====
  - type: web
    name: talentpulse-frontend
    runtime: static
    repo: https://github.com/titoune33/TalentPulse
    buildCommand: npm install && npm run build
    rootDir: frontend
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://talentpulse-backend.onrender.com
