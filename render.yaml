# Render Blueprint — TalentPulse
#
# Déploiement en un clic :
#   https://render.com/deploy?repo=https://github.com/titoune33/TalentPulse
#
# Ce blueprint crée **uniquement le backend** : la base PostgreSQL managée et
# l'API FastAPI. Le frontend Next.js part sur Vercel (voir README →
# « Déploiement »), ce qui évite de payer deux hébergements statiques.
#
# ⚠️ Le plan `free` de Render :
#   - l'API s'endort après 15 min d'inactivité (premier appel ~30 s) ;
#   - la base gratuite **expire au bout de 30 jours**.
#   Pour une démo client, passez la base en `starter` ou recréez-la.

databases:
  - name: talentpulse-db
    plan: free
    databaseName: talentpulse

services:
  - type: web
    name: talentpulse-backend
    runtime: python
    repo: https://github.com/titoune33/TalentPulse
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # FastAPI est une application ASGI : le worker `sync` par défaut de gunicorn
    # ne peut pas la servir (TypeError: FastAPI.__call__() missing 'send').
    # Le worker uvicorn est donc obligatoire. Un seul worker : le modèle ML
    # s'entraîne et s'écrit sur disque au démarrage, deux workers se
    # marcheraient dessus au premier boot.
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --worker-class uvicorn.workers.UvicornWorker --workers 1 --timeout 120
    plan: free
    healthCheckPath: /api/health
    envVars:
      # 3.12 requis : le code utilise la syntaxe `X | None` (PEP 604).
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: talentpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # URL du frontend déployé sur Vercel. Sans elle, le navigateur bloque
      # tous les appels API (CORS). À mettre à jour si le domaine change.
      - key: CORS_ORIGIN
        value: https://talentpulse-inky.vercel.app
      - key: FRONTEND_URL
        value: https://talentpulse-inky.vercel.app
      - key: DEMO_EMAIL
        value: demo@talentpulse.app
      - key: DEMO_PASSWORD
        value: demo1234
      # Facturation : laisser vide = mode démonstration (le plan Pro s'active
      # localement, aucun paiement). Renseigner pour encaisser réellement.
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: STRIPE_PRICE_ID_STARTER
        value: ""
      - key: STRIPE_PRICE_ID_PRO
        value: ""
      - key: STRIPE_PRICE_ID_ENTERPRISE
        value: ""
