<template>

  <style>
    /* Everything below is layout for THIS frame only: no tokens, no colours and
       no browser-frame geometry (all of those live in scene-base.css and must
       not be redeclared here). */

    /* Inner wrapper so the slow push-in never touches the capture's own box.
       --frame-w / --chrome-h are shared tokens: 1472 x 772 viewport. */
    /* In normal flow, NOT absolutely positioned: an absolutely-positioned wrapper
       becomes its own offset parent, which the layout audit reads as a mis-computed
       frame (escaped_container). Relative + 100% keeps it a plain box the scale
       tween can grow from the top-centre. */
    .shot-wrap {
      position: relative;
      width: 100%;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    /* The browser frame is transform-origin'd on its own centre (scale 0.994 -> 1). */
    .browser-frame {
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .browser-dot {
      will-change: opacity;
    }

    /* Rest of the frame's chrome. Each animated element gets its own positioning
       wrapper so GSAP owns a clean, untransformed box to tween. */
    .f2-eyebrow,
    .f2-counter,
    .f2-overlay-text,
    .f2-caption {
      will-change: transform, opacity;
    }
    .f2-caption {
      position: absolute;
      right: var(--pad-x);
      top: 1000px;
      text-align: right;
      white-space: nowrap;
    }
  </style>

      tl.fromTo(

      // 0.60–1.20 — top chrome: eyebrow + counter mask/rise in.
      tl.fromTo(

      tl.fromTo(
