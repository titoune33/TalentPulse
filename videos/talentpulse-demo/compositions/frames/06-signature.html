<template>

  <style>
    /* Frame 06 — closing ink.
       Layout + the one motion origin only. Every token, the ink ground and the

    /* 1 · the wordmark — one centred line, baseline sits at y=430.
       Inter's baseline is ≈0.79em down a 78px/1.0 line box, so top = 430 − 78×0.79. */
    #root .sig-wordmark {

      left: 0;
      right: 0;

    }

    /* 1b · « Pulse » and the URL — a legibility carve-out on the dark plate ONLY.

       darkening. Scoped exception, not a new token — the pulse STROKE below and

    #root .overlay-label .overlay-text {

    }

       The path inside is beat-less (no animation elements), so the one

      left: 480px;
      top: 496px;
      width: 960px;
      height: 120px;

      right: 0;

    #root .overlay-label {

      right: 0;
      text-align: center;
    }
    #root .overlay-label .overlay-rule {

      margin-right: auto;

    /* 5 · the burned-in subtitle strip owns the bottom band, and this frame's URL

       (The ink-footer variables are set for symmetry with frame 01; this frame
       carries its footer as the URL label, not as a hairline.) */
    #root {
      --ink-footer-rule-top: 954px;
      --ink-footer-meta-top: 908px;
    }
    #root .overlay-label {
      top: 966px;
    }

    /* GSAP owns y/scale/opacity on these; hint the compositor only, never a
       CSS `transform` (that would fight the tweens). No `opacity: 0` anywhere —
       every entrance is a `fromTo`, so a cold seek restores the visible state. */
    #root .sig-wordmark,
    #root .sig-line,
    #root .overlay-label .overlay-text {
      will-change: transform, opacity;
    }
    #root .overlay-label .overlay-rule {

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // The product's path, measured on the real element at build time. The path
      // has a static `d`, so getTotalLength() is a fixed number (no reflow, no
      // network) — the dash geometry is therefore never guessed.
      var path = document.querySelector("#root .sig-stroke-path");
      var LEN = path && typeof path.getTotalLength === "function" ? path.getTotalLength() : 0;
      if (path && LEN > 0) {
        path.setAttribute("data-path-length", LEN.toFixed(3));
        path.style.strokeDasharray = LEN + " " + LEN;
      }
      window.__hfPathLengths = window.__hfPathLengths || {};
      window.__hfPathLengths["06-signature"] = LEN;

      // 0.00–0.60 — the wordmark fades up. Opacity plus a 14px rise, no scale.
      tl.fromTo(
        "#root .sig-wordmark",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0,
      );

      // 0.35–1.55 — the pulse stroke draws left to right. Both dash properties
      // are set INSIDE the tween, so there is no CSS/GSAP dash conflict.
      if (LEN > 0) {
        tl.fromTo(
          "#root .sig-stroke-path",
          { strokeDashoffset: LEN },
          { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" },
          0.35,
        );
      }

      // 1.05–1.60 — the closing line rises as the stroke lands.
      tl.fromTo(
        "#root .sig-line",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.05,
      );

      // 1.55–2.00 — the centred cobalt rule wipes out from its own centre.
      tl.fromTo(
        "#root .overlay-label .overlay-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out", transformOrigin: "50% 50%" },
        1.55,
      );

      // 1.70–2.20 — the URL fades up under the rule.
      tl.fromTo(
        "#root .overlay-label .overlay-text",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.7,
      );

      // 2.20–4.55 — absolute stillness. Nothing moves for the whole hold.

      // 4.55–4.90 — the ink plate darkens to graphite-950. The only darkening
      // in the film: not a fade to black, and the content above it stays put.
      // This tween also ends exactly at 4.9s, so the scene's own length is the
      // packet's duration with no filler tween needed.

        "#root .sig-ground",
        { backgroundColor: "#14161A" },
        { backgroundColor: "#0C0E11", duration: 0.35, ease: "power1.inOut" },
        4.55,
      );

      // Registered last, synchronously — an empty early registration would get
      // nested empty when this sub-composition mounts.
      window.__timelines["06-signature"] = tl;
    })();
  </script>
