    // 0.55 -> 1.00  the cobalt rule above the surimpression wipes open

    tl.fromTo(".fp04-index-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 0.55);

    // 0.75 -> 1.30  the surimpression rises into the safe corner

      ".overlay-text",
      { y: 12, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.75,

      ".fp04-tick",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.1 },
      0.8,
