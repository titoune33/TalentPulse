<template>
  <link rel="stylesheet" href="compositions/scene-base.css" />

  <style>
    /* --- the composition root: styled by #root, never by a class --------------
       scene-base.css's .scene-root is scoped to a descendant selector at
       assembly, so it cannot match the root element itself. Mirror the box
       here on #root (which the scoper keeps pointing at this file's root). */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: var(--sans);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    /* the full-bleed paper ground: an inset:0 CHILD layer, never #root — a
       background painted on the root is clip-gated to the frame's window */
    #f3-ground {
      position: absolute;
      inset: 0;
    }

    /* --- the reframe wrapper ------------------------------------------------
       The whole crop lives in ONE gsap.fromTo (x / y / scale). Deliberately no
       CSS `transform` here: the tween owns the full transform state. Only the
       origin belongs to CSS. */
    .shot-wrap {
      position: relative;
      width: 100%;
      transform-origin: 0 0;
    }

    /* --- cobalt annotation bracket over the critical-alert banner -----------
       Frame coordinates, taken straight off the applied crop:
       banner x 315→900, y 300→350 at scale 1.27. */
    /* MEASURED against the applied crop, not derived. With translate(-160px,-217px)
       scale(1.30) the critical banner renders at frame x 215→710, y 269→330.
       A temporary dashed outline was snapshotted to read those numbers independently,
       and the bracket then re-centred on the band: rules at y 217 and y 265 straddle
       the banner rather than sitting on it. Re-measure the same way if the crop moves. */
    .f03-bracket {
      position: absolute;
      left: 355px;
      top: 217px;
      width: 356px;
      height: 48px;
    }
    .f03-bracket-top {
      left: 0;
      top: 0;
      width: 356px;
      height: 1px;
    }
    .f03-bracket-bottom {
      left: 0;
      top: 48px;
      width: 356px;
      height: 1px;
    }
    .f03-bracket-tie {
      left: 0;
      top: 0;
      width: 1px;
      height: 24px;
    }

    /* the cobalt rule above the surimpression wipes open from the left */
    .overlay-rule {
      transform-origin: 0% 50%;
    }
  </style>

  <div
    id="root"
    data-composition-id="03-cas-critiques"
    data-duration="5.5"
    data-width="1920"
    data-height="1080"
  >
    <!-- the full-bleed paper ground, on its own lowest clip layer -->
    <div
      id="f3-ground"
      class="ground-paper clip"
      data-start="0"
      data-duration="5.5"
      data-track-index="0"
    ></div>

    <!-- chrome — identical to scene 02 -->
    <div class="chrome-rule"></div>
    <div class="chrome-eyebrow"><span class="t-mono-label">LE MOTEUR</span></div>
    <div class="chrome-counter"><span class="t-mono-label">03 / 06</span></div>

    <!-- the same browser-frame, identical geometry: only the inner crop differs -->
    <div class="browser-frame" data-layout-allow-overflow>
      <div class="browser-bar">
        <div class="browser-dots">
          <span class="browser-dot"></span>
          <span class="browser-dot"></span>
          <span class="browser-dot"></span>
        </div>
        <div class="browser-url">talentpulse.app / dashboard</div>
      </div>
      <div class="browser-viewport">
        <div class="shot-wrap" data-layout-allow-overflow data-layout-allow-occlusion>
          <img
            class="browser-shot"
            src="assets/product/dashboard.png"
            alt=""
          />
        </div>
      </div>
    </div>

    <!-- cobalt annotation bracket, drawn over the critical-alert banner -->
    <div class="bracket f03-bracket">
      <div class="bracket-rule bracket-h f03-bracket-top"></div>
      <div class="bracket-rule bracket-h f03-bracket-bottom"></div>
      <div class="bracket-rule bracket-v f03-bracket-tie"></div>
    </div>

    <!-- surimpression, bottom-left safe corner -->
    <div class="overlay-label" data-layout-allow-overflow>
      <div class="overlay-rule"></div>
      <div class="overlay-text">CAS CRITIQUES ≥ 70 %</div>
    </div>

    <!-- risk legend, below the frame, never on it -->
    <div class="risk-caption" data-layout-allow-overflow>
      <span class="risk-row"
        ><span class="risk-dot risk-high"></span
        ><span class="risk-label">≥ 70 %</span></span
      >
      <span class="risk-row"
        ><span class="risk-dot risk-watch"></span
        ><span class="risk-label">40–69 %</span></span
      >
      <span class="risk-row"
        ><span class="risk-dot risk-healthy"></span
        ><span class="risk-label">&lt; 40 %</span></span
      >
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // 0.00 — the reframe ARRIVES already zoomed and settles. No reset to 1:
    //        continuity across the cut with scene 02 is the point.
    //        CROP MATHS (image is 2880×1800, base render 1472×920 in a 772px viewport):
    //        frame 02 lets the viewport sit at image y 148→920, so the critical banner
    //        (image y 283→378) is only just inside and the Top-5 register (y 372→720)
    //        is bottom-clipped. The first attempt here used y:-135, which showed almost
    //        exactly the same window as scene 02 — the snapshot proved there was no
    //        reframe at all. Pinning the viewport to the image's FOOT (y 217→862)
    //        moves the banner to frame y≈269 and puts the whole Top-5 register, risk
    //        scores included, inside the frame. That is the "zoom's" real payoff.
    tl.fromTo(
      ".shot-wrap",
      { x: -160, y: -217, scale: 1.3 },
      { x: -160, y: -217, scale: 1.27, duration: 4.4, ease: "power2.out" },
      0
    );

    // 0.30 — the cobalt rule wipes open from the left
    tl.fromTo(
      ".overlay-rule",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.45, ease: "power2.out" },
      0.3
    );

    // 0.45 — the surimpression rises into place
    tl.fromTo(
      ".overlay-text",
      { y: 12, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.45
    );

    // 0.70 — the three risk rows stagger up, 0.08s apart
    tl.fromTo(
      ".risk-row",
      { y: 8, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 },
      0.7
    );

    // 1.30 — the bracket draws: two horizontals, then the vertical tie
    tl.fromTo(
      ".f03-bracket-top",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.5, ease: "power2.out" },
      1.3
    );
    tl.fromTo(
      ".f03-bracket-bottom",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.5, ease: "power2.out" },
      1.42
    );
    tl.fromTo(
      ".f03-bracket-tie",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.4, ease: "power2.out" },
      1.54
    );

    // 1.90 — the whole bracket recedes to 35 %: it annotates, it never covers
    tl.fromTo(
      ".f03-bracket",
      { opacity: 1 },
      { opacity: 0.55, duration: 0.4, ease: "power2.out" },
      1.9
    );

    window.__timelines["03-cas-critiques"] = tl;
  </script>
</template>
